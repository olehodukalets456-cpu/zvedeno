services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zvedeno
      POSTGRES_PASSWORD: zvedeno
      POSTGRES_DB: zvedeno
    ports:
      - "5432:5432"
    volumes:
      - zvedeno_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zvedeno -d zvedeno"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zvedeno_postgres:
