name: Run production sync once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-sync-once.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Zvedeno production sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is missing"
            exit 1
          fi

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 10 \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://etarget.site/api/cron/hourly-sync
