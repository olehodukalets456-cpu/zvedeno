name: Hourly production sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Zvedeno hourly sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is missing"
            exit 1
          fi

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 10 \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://etarget.site/api/cron/hourly-sync
