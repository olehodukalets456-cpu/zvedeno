name: Fix analytics reset typing

on:
  push:
    paths:
      - .github/workflows/fix-analytics-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch analytics page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/projects/[projectId]/analytics/page.tsx')
          content = path.read_text()
          old = 'const resetReport = SAVED_REPORTS.find((report) => report.key === "all") ?? SAVED_REPORTS[0];'
          new = 'const resetReport = SAVED_REPORTS.find((report) => report.key === "all");\n    if (!resetReport) throw new Error("Не знайдено базовий пресет звіту");'
          if old not in content:
              raise SystemExit('Expected resetReport line was not found')
          path.write_text(content.replace(old, new, 1))
          PY
          git config user.name "zvedeno-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'apps/web/app/projects/[projectId]/analytics/page.tsx'
          git commit -m "Fix saved report reset typing"
          git push origin HEAD:main
